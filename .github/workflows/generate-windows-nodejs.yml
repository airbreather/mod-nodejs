name: Generate Windows Node.js

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: vars
        id: variables
        run: |
          echo "nodejs_tag=v26.8.1" >> "$env:GITHUB_OUTPUT"

      - name: fetch
        id: nodejs
        run: |
          $tag = "${{ steps.variables.outputs.nodejs_tag }}"
          New-Item -ItemType Directory -Force nodejs-src
          curl -fSL "https://github.com/nodejs/node/archive/refs/tags/${tag}.tar.gz" |
            tar -xzf - -C nodejs-src --strip-components=1
          "dir=$(Resolve-Path nodejs-src)" >> "$env:GITHUB_OUTPUT"

      - name: vcbuild
        working-directory: ${{ steps.nodejs.outputs.dir }}
        run: |
          .\vcbuild.bat release x64 clang-cl dll v8temporal

      - name: install headers
        working-directory: ${{ steps.nodejs.outputs.dir }}
        run: |
          $dest = "${{ github.workspace }}/out/nodejs-${{ steps.variables.outputs.nodejs_tag }}"
          python tools\install.py install --dest-dir $dest --prefix '' --headers-only

      - name: collect
        run: |
          $dest = "${{ github.workspace }}/out/nodejs-${{ steps.variables.outputs.nodejs_tag }}"
          $src = "${{ steps.nodejs.outputs.dir }}"
          New-Item -ItemType Directory -Force "$dest/bin"
          New-Item -ItemType Directory -Force "$dest/zlib"
          Copy-Item "$src/out/Release/libnode.dll" "$dest/bin/"
          Copy-Item "$src/out/Release/node.lib" "$dest/bin/"
          # Generate zlib.lib: a thin import lib that binds zlib symbols to libnode.dll
          $syms = @(
            'adler32','compress','compress2','compressBound','crc32','crc32_combine',
            'crc32_combine64','crc32_z','deflate','deflateBound','deflateCopy','deflateEnd',
            'deflateInit2_','deflateInit_','deflateParams','deflatePrime','deflateReset',
            'deflateResetKeep','deflateSetDictionary','deflateStream','deflateSync','gzclose',
            'gzclearerr','gzerror','gzflush','gzoopen','gzopen','gzread','gzseek','gztell',
            'gzuncompress','gzwrite','inflate','inflateCopy','inflateEnd','inflateGetHeader',
            'inflateInit2_','inflateInit_','inflateMark','inflateReset','inflateReset2',
            'inflateSetDictionary','inflateSync','inflateSyncMatch','inflateBack','inflateBackEnd',
            'uncompress','zError','zlibBuildInfo','zlibCompileFlags','zlibVersion')
          $def = "LIBRARY libnode`nEXPORTS`n" + (($syms | ForEach-Object { "  $_" }) -join "`n")
          Set-Content -Path "$dest/zlib/zlib.def" -Value $def
          $vsPath = (vswhere -latest -products * -property installationPath).Trim()
          $libExe = (Get-ChildItem (Join-Path $vsPath 'VC\Tools\MSVC') -Recurse -Filter lib.exe |
            Where-Object { $_.FullName -match 'Hostx64' } | Select-Object -First 1).FullName
          Push-Location "$dest/zlib"
          & $libExe /nologo /MACHINE:X64 /OUT:zlib.lib /DEF:zlib.def
          del zlib.def zlib.exp
          Pop-Location

      - name: archive
        run: |
          Push-Location out
          7z a -tzip -mx=9 "nodejs-${{ steps.variables.outputs.nodejs_tag }}.zip" "nodejs-${{ steps.variables.outputs.nodejs_tag }}"
          Pop-Location

      - name: upload
        uses: actions/upload-artifact@v7
        with:
          path: "nodejs-${{ steps.variables.outputs.nodejs_tag }}.zip"
          archive: false
