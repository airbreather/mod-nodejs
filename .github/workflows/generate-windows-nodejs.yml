name: Generate Windows Node.js

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: vars
        id: variables
        run: |
          echo "nodejs_tag=v26.8.2" >> "$env:GITHUB_OUTPUT"

      - name: fetch
        id: nodejs
        run: |
          $tag = "${{ steps.variables.outputs.nodejs_tag }}"
          New-Item -ItemType Directory -Force nodejs-src
          curl -fSL "https://github.com/nodejs/node/archive/refs/tags/${tag}.tar.gz" |
            tar -xzf - -C nodejs-src --strip-components=1
          "dir=$(Resolve-Path nodejs-src)" >> "$env:GITHUB_OUTPUT"

      - name: prefix zlib symbols
        working-directory: ${{ steps.nodejs.outputs.dir }}
        shell: bash
        run: |
          sed -i 's/^#ifdef Z_PREFIX/#define Z_PREFIX\n&/' deps/zlib/zconf.h
          sed -i -E 's/^    ([A-Za-z0-9_]+)$/    z_\1/' deps/zlib/win32/zlib.def

      - name: build (Release config)
        working-directory: ${{ steps.nodejs.outputs.dir }}
        run: |
          .\vcbuild.bat release x64 clang-cl dll v8temporal
          $dest = Join-Path "${{ github.workspace }}" "out" "nodejs-${{ steps.variables.outputs.nodejs_tag }}"
          python (Join-Path "tools" "install.py") install --dest-dir $dest --prefix '' --headers-only

      - name: build (Debug config)
        working-directory: ${{ steps.nodejs.outputs.dir }}
        run: |
          .\vcbuild.bat debug x64 clang-cl dll v8temporal

      - name: collect
        working-directory: ${{ steps.nodejs.outputs.dir }}
        run: |
          $tag  = "${{ steps.variables.outputs.nodejs_tag }}"
          $main = Join-Path "${{ github.workspace }}" "out" "nodejs-$tag"
          $pdb  = Join-Path "${{ github.workspace }}" "out" "nodejs-$tag-pdb"
          New-Item -ItemType Directory -Force $main
          New-Item -ItemType Directory -Force $pdb
          foreach ($config in "Release", "Debug") {
            $src = Join-Path "${{ steps.nodejs.outputs.dir }}" "out" $config
            $bin = Join-Path $main "bin" $config
            New-Item -ItemType Directory -Force $bin
            New-Item -ItemType Directory -Force (Join-Path $pdb $config)
            Copy-Item (Join-Path $src "libnode.dll") $bin
            Copy-Item (Join-Path $src "libnode.lib") $bin
            Copy-Item (Join-Path $src "libnode.pdb") (Join-Path $pdb $config)
          }

      - name: archive
        run: |
          $tag = "${{ steps.variables.outputs.nodejs_tag }}"
          Push-Location (Join-Path "${{ github.workspace }}" "out")
          7z a -r -mx9 -m0=BCJ2 -m1=LZMA2:d=3840m:fb=273 -ms=on -mmt=3 "nodejs-$tag.7z" "nodejs-$tag"
          7z a -r -mx9 -m0=BCJ2 -m1=LZMA2:d=3840m:fb=273 -ms=on -mmt=3 "nodejs-$tag-pdb.7z" "nodejs-$tag-pdb"

      - name: upload (DLLs)
        uses: actions/upload-artifact@v7
        with:
          path: "out/nodejs-${{ steps.variables.outputs.nodejs_tag }}.7z"
          archive: false

      - name: upload (PDBs)
        uses: actions/upload-artifact@v7
        with:
          path: "out/nodejs-${{ steps.variables.outputs.nodejs_tag }}-pdb.7z"
          archive: false
