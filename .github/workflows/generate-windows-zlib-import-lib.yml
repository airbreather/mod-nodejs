name: Generate zlib import lib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: generate
        run: |
          $syms = @(
            'adler32','compress','compress2','compressBound','crc32','crc32_combine',
            'crc32_combine64','crc32_z','deflate','deflateBound','deflateCopy','deflateEnd',
            'deflateInit2_','deflateInit_','deflateParams','deflatePrime','deflateReset',
            'deflateResetKeep','deflateSetDictionary','deflateStream','deflateSync','gzclose',
            'gzclearerr','gzerror','gzflush','gzoopen','gzopen','gzread','gzseek','gztell',
            'gzuncompress','gzwrite','inflate','inflateCopy','inflateEnd','inflateGetHeader',
            'inflateInit2_','inflateInit_','inflateMark','inflateReset','inflateReset2',
            'inflateSetDictionary','inflateSync','inflateSyncMatch','inflateBack','inflateBackEnd',
            'uncompress','zError','zlibBuildInfo','zlibCompileFlags','zlibVersion')
          $def = "LIBRARY libnode`nEXPORTS`n" + (($syms | ForEach-Object { "  $_" }) -join "`n")
          Set-Content -Path "zlib.def" -Value $def
          $vsPath = (vswhere -latest -products * -property installationPath).Trim()
          $libExe = (Get-ChildItem (Join-Path $vsPath 'VC\Tools\MSVC') -Recurse -Filter lib.exe |
            Where-Object { $_.FullName -match 'Hostx64' } | Select-Object -First 1).FullName
          & $libExe /nologo /MACHINE:X64 /OUT:zlib.lib /DEF:zlib.def

      - name: upload
        uses: actions/upload-artifact@v7
        with:
          path: zlib.lib
          archive: false
