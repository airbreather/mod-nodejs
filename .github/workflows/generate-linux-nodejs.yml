name: Generate Linux Node.js

on:
  workflow_dispatch:
    inputs:
      nodejs_tag:
        description: 'Node.js version (git tag)'
        required: true
        default: 'v26.9.0'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: fetch
        id: nodejs
        run: |
          TAG="${{ inputs.nodejs_tag }}"
          mkdir nodejs-src
          curl -fSL "https://github.com/nodejs/node/archive/refs/tags/${TAG}.tar.gz" |
            tar -xzf - -C nodejs-src --strip-components=1
          echo "dir=$(pwd)/nodejs-src" >> "$GITHUB_OUTPUT"

      - name: configure
        working-directory: ${{ steps.nodejs.outputs.dir }}
        run: |
          ./configure \
            --prefix="${{ github.workspace }}/out/nodejs-${{ inputs.nodejs_tag }}" \
            --v8-enable-temporal-support \
            --shared

      - name: make (install)
        working-directory: ${{ steps.nodejs.outputs.dir }}
        run: |
          make -j"$(nproc)" install

      - name: archive
        run: |
          tar -cf - -C out "nodejs-${{ inputs.nodejs_tag }}" \
            | zstd --ultra -22 -o "nodejs-${{ inputs.nodejs_tag }}.tar.zst"

      - name: upload
        uses: actions/upload-artifact@v7
        with:
          path: "nodejs-${{ inputs.nodejs_tag }}.tar.zst"
          archive: false
